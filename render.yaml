services:
  - type: web
    name: mathgen-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: GROQ_API_KEY
        sync: false  # tells Render to not pull this from GitHub
      - key: WHISPER_MODEL
        value: base  # or whatever model you're using
